name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Prepare Web Assets and Biometrics Bridge
        run: |
          mkdir -p www
          cp *.html *.png *.webmanifest *.js *.txt _headers www/ 2>/dev/null || true
          cat << 'EOF' > www/bio-bridge.js
          (function() {
            const callNativeBiometric = async (reasonText) => {
              if (!window.Capacitor) {
                throw new Error('بيئة التطبيق غير جاهزة');
              }
              const plugins = window.Capacitor.Plugins || {};
              const bioKey = Object.keys(plugins).find(k => k.toLowerCase().includes('biometric'));
              const plugin = bioKey ? plugins[bioKey] : (window.Capacitor.registerPlugin ? window.Capacitor.registerPlugin('NativeBiometric') : null);

              if (!plugin) {
                throw new Error('الإضافات المتاحة فقط: ' + Object.keys(plugins).join(', '));
              }

              if (plugin.verifyIdentity) {
                return await plugin.verifyIdentity({
                  reason: reasonText,
                  title: 'التحقق بالبصمة',
                  subtitle: 'SME Agri',
                  description: reasonText
                });
              } else if (plugin.authenticate) {
                return await plugin.authenticate({
                  reason: reasonText,
                  cancelTitle: 'إلغاء'
                });
              }
              throw new Error('دالة التحقق غير موجودة في الإضافة');
            };

            const bridge = {
              create: async (opts) => {
                await callNativeBiometric('تسجيل بصمة العامل');
                const fakeId = new Uint8Array();
                return {
                  id: 'cap-bio-' + Date.now(),
                  rawId: fakeId.buffer,
                  type: 'public-key',
                  response: {
                    clientDataJSON: fakeId.buffer,
                    attestationObject: fakeId.buffer
                  },
                  getClientExtensionResults: () => ({})
                };
              },
              get: async (opts) => {
                await callNativeBiometric('تأكيد الحضور والانصراف بالبصمة');
                const fakeId = new Uint8Array();
                return {
                  id: 'cap-bio-auth',
                  rawId: fakeId.buffer,
                  type: 'public-key',
                  response: {
                    clientDataJSON: fakeId.buffer,
                    authenticatorData: fakeId.buffer,
                    signature: fakeId.buffer
                  },
                  getClientExtensionResults: () => ({})
                };
              }
            };

            if (!window.PublicKeyCredential) { window.PublicKeyCredential = function(){}; }
            window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable = async () => true;
            try {
              Object.defineProperty(navigator, 'credentials', { value: bridge, configurable: true });
            } catch(e) {
              navigator.credentials = bridge;
            }
          })();
          EOF
          sed -i 's/<\/body>/<script src="bio-bridge.js"><\/script><\/body>/' www/index.html
      - name: Install Capacitor and Add Android
        run: |
          npm install --legacy-peer-deps
          npx cap add android
          npx cap sync
      - name: Set App Icon and Permissions
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ] && [ -f "icon-512.png" ]; then
              cp icon-512.png "$dir/ic_launcher.png"
              cp icon-512.png "$dir/ic_launcher_round.png"
              cp icon-512.png "$dir/ic_launcher_foreground.png"
            fi
          done
          sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" \/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>/' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SME-Agri-App
          path: android/app/build/outputs/apk/debug/app-debug.apk

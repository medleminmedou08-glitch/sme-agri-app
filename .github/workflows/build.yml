name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Prepare Web Assets, Logo and Biometrics Bridge
        run: |
          mkdir -p www assets
          cp *.html *.png *.webmanifest *.js *.txt _headers www/ 2>/dev/null || true
          cp icon-512.png assets/icon-only.png 2>/dev/null || true
          cp icon-512.png assets/icon-foreground.png 2>/dev/null || true
          cp icon-512.png assets/splash.png 2>/dev/null || true
          cat << 'EOF' > www/bio-bridge.js
          (function() {
            const bridge = {
              create: async (opts) => {
                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.BiometricAuth) {
                  await window.Capacitor.Plugins.BiometricAuth.authenticate({ reason: 'تسجيل بصمة العامل' });
                  return { id: 'cap-bio-' + Date.now(), rawId: new Uint8Array().buffer, type: 'public-key', response: {} };
                }
                throw new Error('Not supported');
              },
              get: async (opts) => {
                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.BiometricAuth) {
                  await window.Capacitor.Plugins.BiometricAuth.authenticate({ reason: 'تأكيد الحضور والانصراف بالبصمة' });
                  return { id: 'cap-bio-auth', rawId: new Uint8Array().buffer, type: 'public-key', response: {} };
                }
                throw new Error('Not supported');
              }
            };
            if (!window.PublicKeyCredential) { window.PublicKeyCredential = function(){}; }
            window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable = async () => true;
            try { Object.defineProperty(navigator, 'credentials', { value: bridge, configurable: true }); } catch(e) {}
          })();
          EOF
          sed -i 's/<head>/<head><script src="bio-bridge.js"><\/script>/' www/index.html
      - name: Install Capacitor and Generate Icons
        run: |
          npm install --legacy-peer-deps
          npx cap add android
          npx -y @capacitor/assets generate --android --iconBackgroundColor '#1a3622' --splashBackgroundColor '#1a3622' || true
          npx cap sync
      - name: Add Permissions to AndroidManifest
        run: |
          sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>/' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SME-Agri-App
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Prepare Web Assets and Biometrics Bridge
        run: |
          mkdir -p www
          cp *.html *.png *.webmanifest *.js *.txt _headers www/ 2>/dev/null || true
          cat << 'EOF' > www/bio-bridge.js
          (function() {
            const callNativeBiometric = async (reasonText) => {
              // الانتظار لمدة قصيرة في حال كان الجسر لا يزال يتهيأ
              for (let i = 0; i < 15; i++) {
                if (window.Capacitor) break;
                await new Promise(r => setTimeout(r, 100));
              }
              if (!window.Capacitor) {
                throw new Error('لم يتم العثور على بيئة التطبيق (Capacitor)');
              }

              // البحث عن الإضافة في الكائنات المحملة
              let plugin = window.Capacitor.Plugins && window.Capacitor.Plugins.BiometricAuth;
              
              // محاولة استدعائها عبر جسر Capacitor المباشر إذا لم تكن في Plugins
              if (!plugin && window.Capacitor.nativePromise) {
                return await window.Capacitor.nativePromise('BiometricAuth', 'authenticate', {
                  reason: reasonText,
                  cancelTitle: 'إلغاء',
                  allowDeviceCredential: true
                });
              }

              if (!plugin && window.Capacitor.registerPlugin) {
                plugin = window.Capacitor.registerPlugin('BiometricAuth');
              }

              if (!plugin) {
                throw new Error('إضافة البصمة غير مثبتة في حزمة الأندرويد');
              }

              return await plugin.authenticate({
                reason: reasonText,
                cancelTitle: 'إلغاء',
                allowDeviceCredential: true
              });
            };

            const bridge = {
              create: async (opts) => {
                await callNativeBiometric('تسجيل بصمة العامل');
                const fakeId = new Uint8Array([1, 2, 3, 4]);
                return {
                  id: 'cap-bio-' + Date.now(),
                  rawId: fakeId.buffer,
                  type: 'public-key',
                  response: {
                    clientDataJSON: fakeId.buffer,
                    attestationObject: fakeId.buffer
                  },
                  getClientExtensionResults: () => ({})
                };
              },
              get: async (opts) => {
                await callNativeBiometric('تأكيد الحضور والانصراف بالبصمة');
                const fakeId = new Uint8Array([1, 2, 3, 4]);
                return {
                  id: 'cap-bio-auth',
                  rawId: fakeId.buffer,
                  type: 'public-key',
                  response: {
                    clientDataJSON: fakeId.buffer,
                    authenticatorData: fakeId.buffer,
                    signature: fakeId.buffer
                  },
                  getClientExtensionResults: () => ({})
                };
              }
            };

            if (!window.PublicKeyCredential) { window.PublicKeyCredential = function(){}; }
            window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable = async () => true;
            try {
              Object.defineProperty(navigator, 'credentials', { value: bridge, configurable: true });
            } catch(e) {
              navigator.credentials = bridge;
            }
          })();
          EOF
          sed -i 's/<\/body>/<script src="bio-bridge.js"><\/script><\/body>/' www/index.html
      - name: Install Capacitor and Add Android
        run: |
          npm install --legacy-peer-deps
          npx cap add android
          npx cap sync
      - name: Set App Icon and Permissions
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ] && [ -f "icon-512.png" ]; then
              cp icon-512.png "$dir/ic_launcher.png"
              cp icon-512.png "$dir/ic_launcher_round.png"
              cp icon-512.png "$dir/ic_launcher_foreground.png"
            fi
          done
          sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" \/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>/' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SME-Agri-App
          path: android/app/build/outputs/apk/debug/app-debug.apk

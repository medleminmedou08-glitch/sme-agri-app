<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SME Agri – نظام إدارة المزارع</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#1a4d24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SME Agri">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea;--card:#ffffff;--ink:#1d2a22;--mut:#6b7a70;--line:#e5e0d3;
  --g1:#1a4d24;--g2:#2e7d32;--g3:#7bc47f;--gold:#f39c12;--gold2:#ffbf5a;
  --red:#c0392b;--blue:#2b6cb0;--orange:#d9822b;--shadow:0 8px 28px rgba(20,60,35,.10);--r:18px;
}
[data-theme=dark]{
  --bg:#0f1713;--card:#17231c;--ink:#e8efe9;--mut:#93a699;--line:#243329;
  --shadow:0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Cairo","Segoe UI","Tajawal",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;transition:background .3s}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
/* Sidebar */
.side{width:250px;background:linear-gradient(170deg,var(--g1),#0b3a1f 70%);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
.brand .lg{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.brand b{font-size:19px;display:block}.brand small{opacity:.7;font-size:12px}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:transparent;color:#d9eadd;border-radius:12px;cursor:pointer;text-align:right;width:100%;transition:.2s}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.on{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#2b2100;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.nav i{font-style:normal;font-size:19px;width:24px;text-align:center}
.side .foot{margin-top:auto;font-size:12px;opacity:.6;text-align:center;padding-top:10px}
/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:16px 26px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-size:22px;flex:1}
.chip{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:30px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-size:14px;box-shadow:var(--shadow);white-space:nowrap}
.ibtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;box-shadow:var(--shadow)}
#view{padding:24px 26px 60px;max-width:1300px;width:100%;margin:0 auto;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* Cards */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h3{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.kpi{position:relative;overflow:hidden}
.kpi .ic{position:absolute;left:14px;top:14px;font-size:30px;opacity:.9}
.kpi small{color:var(--mut);font-size:13px}
.kpi b{display:block;font-size:26px;margin-top:6px}
.kpi::after{content:"";position:absolute;bottom:0;right:0;left:0;height:4px;background:linear-gradient(90deg,var(--g2),var(--gold))}
.hero{background:linear-gradient(135deg,var(--g1),var(--g2) 60%,#3d9a5a);color:#fff;border:0;position:relative;overflow:hidden}
.hero .empty,.hero .muted{color:#e8f5e9}
.hero::before{content:"🌾";position:absolute;font-size:150px;opacity:.1;left:-10px;bottom:-30px}
.sec{display:flex;align-items:center;gap:10px;margin:26px 0 14px;flex-wrap:wrap}
.sec h2{font-size:19px;flex:1}
/* Buttons */
.btn{border:0;padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:600;background:linear-gradient(135deg,var(--g2),var(--g1));color:#fff;box-shadow:0 4px 12px rgba(20,83,45,.3);transition:.2s}
.btn:hover{transform:translateY(-1px)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#a8832f);color:#241b00}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.red{background:var(--red)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
/* Tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;color:var(--mut);font-weight:600;padding:10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:hover td{background:color-mix(in srgb,var(--g3) 7%,transparent)}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.t-g{background:#e0f3e4;color:#14632f}.t-r{background:#fbe1dd;color:#a3271b}.t-y{background:#fbf0cf;color:#7a5a00}.t-b{background:#dcebfa;color:#1d4f86}
[data-theme=dark] .t-g{background:#1d4a2b;color:#a8e8b5}[data-theme=dark] .t-r{background:#5a2420;color:#ffc2bb}[data-theme=dark] .t-y{background:#54430f;color:#ffe08a}[data-theme=dark] .t-b{background:#1c3a5a;color:#a9cdf2}
.inc{color:var(--g2);font-weight:700}.exp{color:var(--red);font-weight:700}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0}
.bar>div{height:100%;background:linear-gradient(90deg,var(--g3),var(--gold));border-radius:9px;transition:width .6s}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--mut);font-size:13px}
.empty{text-align:center;padding:36px 10px;color:var(--mut)}
.empty b{display:block;font-size:40px;margin-bottom:6px}
.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px;border:1px solid var(--line);width:fit-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 18px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--mut);white-space:nowrap}
.tabs button.on{background:linear-gradient(135deg,var(--g2),var(--g1));color:#fff}
.alert{display:flex;gap:10px;padding:11px 14px;border-radius:12px;margin-bottom:8px;font-size:14px;align-items:flex-start;line-height:1.6}
.a-ok{background:#e6f4ea;color:#1c5a30}.a-warn{background:#fff3d6;color:#7a5300}.a-bad{background:#fde4e1;color:#9a2a1e}.a-info{background:#e3effb;color:#1d4f86}
[data-theme=dark] .a-ok{background:#183a25;color:#b4ecc2}[data-theme=dark] .a-warn{background:#493a0c;color:#ffe08f}[data-theme=dark] .a-bad{background:#4d1f1b;color:#ffc7c0}[data-theme=dark] .a-info{background:#173149;color:#b3d3f3}
canvas{width:100%;height:230px;display:block}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-left:6px}
/* Weather */
.wnow{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.wnow .big{font-size:64px;font-weight:800;line-height:1}
.wnow .em{font-size:72px}
.wdet{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:16px}
.wdet div{background:rgba(255,255,255,.14);padding:10px 12px;border-radius:12px;font-size:13px}
.wdet b{display:block;font-size:16px;margin-top:2px}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.day{text-align:center;padding:14px 8px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.day .e{font-size:30px}.day b{display:block;margin:4px 0}.day small{color:var(--mut)}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(5,20,10,.55);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px;animation:fade .2s}
.md{background:var(--card);border-radius:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.md h3{font-size:19px;margin-bottom:16px}
.fg{margin-bottom:13px}
.fg label{display:block;font-size:13px;color:var(--mut);margin-bottom:5px;font-weight:600}
.fg input,.fg select,.fg textarea{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg);outline:none;transition:.2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--g2);box-shadow:0 0 0 3px color-mix(in srgb,var(--g3) 30%,transparent)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:10px;margin-top:18px}.acts .btn{flex:1}
.res{padding:11px 14px;border:1px solid var(--line);border-radius:11px;margin-bottom:6px;cursor:pointer}
.res:hover{background:var(--bg);border-color:var(--g2)}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(30px);background:#14321f;color:#fff;padding:12px 22px;border-radius:30px;opacity:0;transition:.3s;z-index:200;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#toast.on{opacity:1;transform:translateX(-50%)}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* ===== v2: هوية SME Agri ===== */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(620px 420px at 95% -5%,rgba(243,156,18,.13),transparent 70%),radial-gradient(760px 520px at 0% 105%,rgba(46,125,50,.13),transparent 70%)}
.brand .lg{width:56px;height:56px;border-radius:50%;background:#fff;overflow:hidden;display:block;padding:0;box-shadow:0 0 0 3px rgba(255,255,255,.2),0 6px 16px rgba(0,0,0,.35)}
.brand .lg img{width:100%;height:100%;object-fit:cover;display:block}
.brand b{letter-spacing:.3px}
.tlogo{display:none;width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid var(--line);box-shadow:var(--shadow)}
.top h1{font-weight:800}
.kpi{transition:transform .25s,box-shadow .25s}.kpi:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(20,60,35,.16)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#d9820b);color:#2b1600}
.greet{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:var(--r);margin-bottom:16px;background:linear-gradient(120deg,var(--card),color-mix(in srgb,var(--gold) 10%,var(--card)));border:1px solid var(--line);box-shadow:var(--shadow);border-inline-start:6px solid var(--gold)}
.greet img{width:62px;height:62px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);flex-shrink:0}
.greet h2{font-size:21px}.greet p{color:var(--mut);font-size:13px;margin-top:3px}
/* شاشة الترحيب */
#splash{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff;overflow:hidden;background:radial-gradient(circle at 50% 28%,#2f8a36 0%,#1a4d24 52%,#0b2a13 100%);transition:opacity .8s,visibility .8s,transform .8s}
#splash:empty{display:none}
#splash.out{opacity:0;visibility:hidden;transform:scale(1.05)}
.sp-fl span{position:absolute;font-size:34px;opacity:.18;animation:flt 9s ease-in-out infinite}
.sp-fl span:nth-child(1){top:12%;right:10%}.sp-fl span:nth-child(2){top:24%;left:9%;animation-delay:-2s}.sp-fl span:nth-child(3){bottom:20%;right:14%;animation-delay:-4s}.sp-fl span:nth-child(4){bottom:12%;left:12%;animation-delay:-6s}.sp-fl span:nth-child(5){top:55%;right:5%;animation-delay:-1s}.sp-fl span:nth-child(6){top:8%;left:42%;animation-delay:-3s}
@keyframes flt{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(14deg)}}
.sp-logo{width:min(210px,52vw);height:min(210px,52vw);border-radius:50%;background:#fff;overflow:hidden;box-shadow:0 0 0 8px rgba(255,255,255,.14),0 0 0 20px rgba(255,255,255,.06),0 24px 60px rgba(0,0,0,.5);animation:pop 1s cubic-bezier(.2,1.3,.4,1) both;position:relative;z-index:1}
.sp-logo img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes pop{from{transform:scale(.3) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.sp-hi{margin-top:34px;font-size:20px;color:var(--gold2);font-weight:700;animation:up .8s .5s both}
#splash h1{font-size:clamp(26px,6vw,38px);font-weight:800;margin:6px 0;animation:up .8s .7s both;position:relative}
.sp-co{font-size:15px;opacity:.85;letter-spacing:.4px;animation:up .8s .9s both;direction:ltr}
.sp-tag{margin-top:6px;opacity:.7;animation:up .8s 1s both}
.sp-chips,.sp-in{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;animation:up .8s 1.2s both;position:relative}
.sp-chips span{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);padding:7px 15px;border-radius:30px;font-size:14px}
.sp-in input{padding:13px 18px;border-radius:30px;border:0;min-width:min(300px,80vw);text-align:center;font-size:16px;outline:none;color:#1d2a22;background:#fff}
.sp-btn{margin-top:26px;border:0;cursor:pointer;padding:13px 34px;border-radius:30px;font-weight:700;font-size:16px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2b1600;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:up .8s 1.4s both;position:relative}
.sp-bar{position:absolute;bottom:0;right:0;left:0;height:5px;background:rgba(255,255,255,.12)}
.sp-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));animation:load 3.8s linear both}
@keyframes load{from{width:0}to{width:100%}}
/* صفحة الشركة */
.chero{display:flex;gap:26px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,var(--card),color-mix(in srgb,var(--g3) 12%,var(--card)))}
.chero img{width:190px;height:190px;border-radius:50%;background:#fff;box-shadow:0 10px 34px rgba(0,0,0,.18);flex-shrink:0}
.chero h2{font-size:32px;color:var(--g2);font-weight:800}
.chero .fr{font-size:16px;font-weight:600;direction:ltr;text-align:right;margin:2px 0}
.chero .ar{font-size:18px;margin:2px 0}
.irow{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--line)}
.irow:last-child{border:0}
.irow .ii{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 16%,transparent);font-size:18px;flex-shrink:0}
.irow small{color:var(--mut);display:block;font-size:12px}.irow b{font-size:15px;word-break:break-word;font-weight:600}
.ver{display:flex;align-items:center;gap:14px}.ver img{width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}
@media(max-width:860px){.g4{grid-template-columns:repeat(2,1fr);gap:10px}.kpi{padding:14px}.kpi b{font-size:19px}.kpi .ic{font-size:22px;left:10px;top:10px}.kpi small{font-size:12px}.tlogo{display:block}.chero{justify-content:center;text-align:center}.chero img{width:140px;height:140px}.chero .fr{text-align:center}.chero .row{justify-content:center}.greet{padding:12px 14px}.greet img{width:48px;height:48px}.greet h2{font-size:17px}}
@media print{#splash,.tlogo{display:none!important}body::before{display:none}}

/* ===== v2.1: عمالة وبصمة ومحاسبة ===== */
.bio{text-align:center;padding:26px 18px}.bio .bico{font-size:56px;margin-bottom:4px}
.bigb{border:0;cursor:pointer;border-radius:20px;padding:22px 16px;font-size:19px;font-weight:800;color:#fff;min-width:min(230px,44%);flex:1;box-shadow:0 8px 22px rgba(0,0,0,.2);transition:.2s;font-family:inherit}
.bigb:active{transform:scale(.97)}.bigb.in{background:linear-gradient(135deg,#43a047,#1b5e20)}.bigb.out{background:linear-gradient(135deg,#f39c12,#b8660e)}
.mx{font-size:12px}.mx th,.mx td{padding:6px 2px;text-align:center;min-width:25px}.mx td:nth-child(2),.mx td:nth-child(3),.mx th:nth-child(2),.mx th:nth-child(3){padding:6px 8px;min-width:60px}
.mx td:first-child,.mx th:first-child{position:sticky;right:0;background:var(--card);text-align:right;min-width:110px;z-index:1;padding-inline:8px}
.mx td.c{cursor:pointer;user-select:none}.mx td.c:hover{outline:2px solid var(--g3);outline-offset:-2px}.mx td.fut{opacity:.4}
.mx td.f{background:#d9f0dc;color:#14632f;font-weight:700}.mx td.h{background:#fbf0cf;color:#7a5a00;font-weight:700}.mx td.o{background:#dcebfa;color:#1d4f86;font-weight:700}.mx td.a{background:#fbe1dd;color:#a3271b;font-weight:700}
[data-theme=dark] .mx td.f{background:#1d4a2b;color:#a8e8b5}[data-theme=dark] .mx td.h{background:#54430f;color:#ffe08a}[data-theme=dark] .mx td.o{background:#1c3a5a;color:#a9cdf2}[data-theme=dark] .mx td.a{background:#5a2420;color:#ffc2bb}
.mx th.we,.mx td.we:not(.f):not(.h):not(.o):not(.a){background:color-mix(in srgb,var(--gold) 10%,transparent)}
.frow{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px dashed var(--line)}
.frow.h{font-weight:800;color:var(--g2);border-bottom:2px solid var(--line);margin-top:12px}.frow.s{padding-inline-start:14px}.frow.t{font-weight:800;border-bottom:2px solid var(--line)}
summary{outline:none}

/* ===== v2.4 ===== */
html{overscroll-behavior-y:none}body,button,.nav,.chip,.btn{touch-action:manipulation}
.qa{display:flex;gap:10px;overflow-x:auto;margin-bottom:16px;padding:2px 2px 8px;scrollbar-width:none}.qa::-webkit-scrollbar{display:none}
.qa button{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:30px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-weight:600;box-shadow:var(--shadow);transition:.2s}
.qa button:hover{transform:translateY(-2px);border-color:var(--g2)}.qa button span{font-size:19px}
@media(max-width:860px){.side{padding-bottom:calc(6px + env(safe-area-inset-bottom))}#view{padding-bottom:calc(110px + env(safe-area-inset-bottom))}}

/* Mobile */
@media(max-width:860px){
  body{flex-direction:column}
  .side{position:fixed;bottom:0;top:auto;left:0;right:0;width:100%;height:auto;flex-direction:row;padding:6px;gap:2px;z-index:50;border-radius:18px 18px 0 0;overflow-x:auto}
  .brand,.side .foot{display:none}
  .nav{flex-direction:column;gap:2px;padding:8px 10px;font-size:11px;min-width:64px;text-align:center}
  .nav i{font-size:20px}
  .top{padding:12px 14px}.top h1{font-size:18px}
  #view{padding:16px 14px 110px}
  .fr{grid-template-columns:1fr}
  .wnow .big{font-size:50px}.wnow .em{font-size:56px}
  #toast{bottom:100px}
}
@media print{.side,.top,.btn,.ibtn{display:none!important}}
</style>
</head>
<body>
<aside class="side" id="side"></aside>
<div class="main">
  <header class="top">
    <img id="tlogo" class="tlogo" alt=""><h1 id="title"></h1>
    <div class="chip" id="locChip" onclick="pickLocation()">📍 <span id="locName">حدد الموقع</span></div>
    <button class="ibtn" id="themeBtn" onclick="toggleTheme()" title="الوضع الليلي">🌙</button>
  </header>
  <main id="view"></main>
</div>
<div id="toast"></div>

function modal(title,html){

}
function form(title,defs,vals,onSave,saveLabel='حفظ'){
  vals=vals||{};
  const inp=d=>{
    const v=vals[d.k]??d.def??'';let el;
    if(d.t==='select')el=`<select name="${d.k}">${d.o.map(o=>{const ov=typeof o==='object'?o.v:o,ol=typeof o==='object'?o.l:o;return`<option value="${esc(ov)}" ${ov==v?'selected':''}>${esc(ol)}</option>`}).join('')}</select>`;
    else if(d.t==='textarea')el=`<textarea name="${d.k}" rows="3">${esc(v)}</textarea>`;
    else el=`<input name="${d.k}" type="${d.t||'text'}" value="${esc(v)}" ${d.t==='number'?'step="any" min="0" inputmode="decimal"':''} ${d.ph?`placeholder="${d.ph}"`:''}>`;
    return`<div class="fg" ${d.half?'':''}><label>${d.l}${d.req?' *':''}</label>${el}</div>`;
  };
  let h='<form>',buf=[];
  defs.forEach(d=>{if(d.half){buf.push(inp(d));if(buf.length===2){h+=`<div class="fr">${buf.join('')}</div>`;buf=[]}}else{if(buf.length){h+=`<div class="fr">${buf.join('')}</div>`;buf=[]}h+=inp(d)}});
  if(buf.length)h+=`<div class="fr">${buf.join('')}</div>`;
  h+=`<div class="acts"><button type="submit" class="btn">${saveLabel}</button><button type="button" class="btn ghost" data-x>إلغاء</button></div></form>`;
  const o=modal(title,h);
  o.querySelector('[data-x]').onclick=()=>o.remove();
  o.querySelector('form').onsubmit=e=>{
    e.preventDefault();const r={};
    for(const d of defs){
      let v=o.querySelector(`[name=${d.k}]`).value.trim();
      if(d.req&&!v){toast('يرجى تعبئة: '+d.l);return}
      if(d.t==='number'){v=v===''?0:parseFloat(v);if(isNaN(v)||v<0){toast('قيمة غير صحيحة: '+d.l);return}}
      r[d.k]=v;
    }
    if(onSave(r)!==false)o.remove();
  };
  return o;
}

/* رسم بياني أعمدة */
function bars(cv,labels,series){
  if(!cv)return;const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
  const css=getComputedStyle(document.documentElement),mut=css.getPropertyValue('--mut'),line=css.getPropertyValue('--line');
  const max=Math.max(1,...series.flatMap(s=>s.data))*1.1,pt=10,pb=26,pl=8,pr=8,ih=h-pt-pb,gw=(w-pl-pr)/labels.length;
  c.font='12px sans-serif';c.textAlign='center';
  for(let i=0;i<=4;i++){const y=pt+ih*i/4;c.strokeStyle=line;c.beginPath();c.moveTo(pl,y);c.lineTo(w-pr,y);c.stroke()}
  labels.forEach((l,i)=>{
    const gx=w-pr-(i+1)*gw,bw=Math.min(34,gw*.7/series.length);
    series.forEach((s,j)=>{
      const bh=ih*s.data[i]/max,x=gx+gw/2-bw*series.length/2+j*bw+1,y=pt+ih-bh;
      c.fillStyle=s.color;c.beginPath();
      if(c.roundRect)c.roundRect(x,y,bw-2,Math.max(bh,1),[6,6,0,0]);else c.rect(x,y,bw-2,Math.max(bh,1));c.fill();
    });
    c.fillStyle=mut;c.fillText(l,gx+gw/2,h-8);
  });
}

function advice(){
  if(!W)return[];const d=W.daily,c=W.current,a=[];
  const tmax=Math.max(...d.temperature_2m_max.slice(0,3)),tmin=Math.min(...d.temperature_2m_min.slice(0,3));
  const rain=d.precipitation_sum.slice(0,3).reduce((x,y)=>x+y,0),rp=Math.max(...d.precipitation_probability_max.slice(0,2)),wind=Math.max(...d.wind_speed_10m_max.slice(0,2));
  const et=d.et0_fao_evapotranspiration[0];
  if(tmin<=3)a.push(['bad','❄️',`خطر صقيع: الحد الأدنى المتوقع ${Math.round(tmin)}°م. غطِّ الشتلات الحساسة وأجّل الزراعة.`]);
  if(tmax>=40)a.push(['bad','🔥',`موجة حر شديدة (${Math.round(tmax)}°م). اسقِ في الفجر أو المساء وتجنّب العمل وقت الظهيرة.`]);
  else if(tmax>=34)a.push(['warn','🌡️',`حرارة مرتفعة (${Math.round(tmax)}°م). زد معدل الري وراقب إجهاد النباتات والعمال.`]);
  if(rp>=60||rain>=8)a.push(['info','🌧️',`احتمال أمطار مرتفع (${Math.round(rp)}%، ~${rain.toFixed(1)} مم). أجّل الري والرش والتسميد لتوفير المياه وتجنب الهدر.`]);
  else if(rp<20&&et>=5)a.push(['warn','💧',`التبخر مرتفع (${et.toFixed(1)} مم/يوم) مع غياب المطر. يُنصح بالري اليوم.`]);
  if(wind>=30)a.push(['warn','💨',`رياح قوية (${Math.round(wind)} كم/س). لا ترشّ المبيدات، وثبّت الشبك والبيوت المحمية.`]);
  else if(wind<15&&rp<30)a.push(['ok','✅','الرياح هادئة والجو مناسب لرش المبيدات والأسمدة الورقية.']);
  if(c.relative_humidity_2m>=85&&c.temperature_2m>15)a.push(['warn','🍄','رطوبة عالية: احتمال انتشار الأمراض الفطرية. افحص المحاصيل وحسّن التهوية.']);
  if(c.relative_humidity_2m<=25)a.push(['warn','🏜️','هواء جاف جداً قد يزيد التبخر. فكّر في الري بالتنقيط أو التغطية.']);
  if(!a.length)a.push(['ok','🌿','الأحوال الجوية مستقرة ومناسبة للأعمال الزراعية المعتادة.']);
  return a;
}

const STAT=['مخطط','مزروع','نمو','نضج','حصاد','مكتمل'];
const ACT=['ري','تسميد','رش مبيدات','عزيق/تعشيب','تقليم','حصاد','أخرى'];
function progress(f){
  if(f.status==='مكتمل')return 100;if(f.status==='مخطط')return 0;
  if(!f.plant||!f.harvest)return {مزروع:15,نمو:45,نضج:75,حصاد:90}[f.status]||0;
  const p=daysBetween(f.plant,today())/Math.max(1,daysBetween(f.plant,f.harvest))*100;return Math.max(0,Math.min(99,Math.round(p)));
}
function rFields(){
  const cards=S.fields.map(f=>{const p=progress(f),acts=(f.acts||[]).slice(-3).reverse();
    return`<div class="card"><div class="row"><h3 style="margin:0">🌱 ${esc(f.name)}</h3><span class="sp"></span><span class="tag ${f.status==='مكتمل'?'t-b':f.status==='مخطط'?'t-y':'t-g'}">${esc(f.status)}</span></div>
    <p style="margin:8px 0"><b>${esc(f.crop)}</b> ${f.variety?`<span class="muted">(${esc(f.variety)})</span>`:''}</p>
    <div class="row muted"><span>📐 ${num(f.area)} ${esc(S.areaUnit)}</span><span>💧 ${esc(f.irr)}</span>${f.yield?`<span>⚖️ ${num(f.yield)} طن متوقع</span>`:''}</div>
    <div class="bar"><div style="width:${p}%"></div></div>
    <div class="row muted"><span>زراعة: ${fdate(f.plant)}</span><span class="sp"></span><span>حصاد: ${fdate(f.harvest)}</span></div>
    <div style="margin:10px 0 4px;font-weight:600;font-size:13px">آخر الأنشطة</div>
    ${acts.length?acts.map(a=>`<div class="muted">• ${esc(a.type)} — ${fdate(a.date)}${a.cost?` (${money(a.cost)})`:''}</div>`).join(''):'<div class="muted">لا أنشطة بعد</div>'}
    ${f.notes?`<p class="muted" style="margin-top:8px">📝 ${esc(f.notes)}</p>`:''}
    <div class="row" style="margin-top:14px"><button class="btn sm" onclick="addAct('${f.id}')">+ نشاط</button><button class="btn ghost sm" onclick="editField('${f.id}')">تعديل</button><button class="btn ghost sm" onclick="delField('${f.id}')">حذف</button></div></div>`}).join('');
  $('#view').innerHTML=`<div class="row"><p class="muted sp">${S.fields.length} حقل • ${num(sum(S.fields,f=>f.area))} ${esc(S.areaUnit)}</p><button class="btn gold" onclick="openReport('fields')">📄 PDF</button><button class="btn" onclick="editField()">+ حقل جديد</button></div>
  <div class="grid g3" style="margin-top:16px">${cards||`<div class="card" style="grid-column:1/-1">${empty('🌱','لم تُضف أي حقول بعد')}</div>`}</div>`;
}
function editField(id){
  const f=S.fields.find(x=>x.id===id);
  form(f?'تعديل الحقل':'حقل جديد',[
    {k:'name',l:'اسم الحقل',req:1},{k:'crop',l:'المحصول',req:1,half:1},{k:'variety',l:'الصنف',half:1},
    {k:'area',l:'المساحة ('+S.areaUnit+')',t:'number',half:1},{k:'yield',l:'الإنتاج المتوقع (طن)',t:'number',half:1},
    {k:'plant',l:'تاريخ الزراعة',t:'date',half:1},{k:'harvest',l:'تاريخ الحصاد المتوقع',t:'date',half:1},
    {k:'status',l:'الحالة',t:'select',o:STAT,half:1,def:'مخطط'},{k:'irr',l:'نظام الري',t:'select',o:['تنقيط','رش','غمر','مطري'],half:1},

    if(f)Object.assign(f,r);else S.fields.push({id:uid(),acts:[],...r});save();render();toast('تم الحفظ ✓');
  });
}
function delField(id){confirmBox('حذف هذا الحقل وجميع أنشطته؟',()=>{S.fields=S.fields.filter(f=>f.id!==id);save();render()})}

/* ===================== المحاسبة الكاملة ===================== */
const ASSET_CATS={'أراضي':0,'مباني وإنشاءات':20,'آلات ومعدات':10,'مركبات':5,'شبكات ري وآبار':10,'أثاث وأجهزة':5,'أخرى':5};
const A_BASE={'1000':'النقدية والصندوق','1100':'الذمم المدينة (العملاء)','1500':'الأصول الثابتة (بالتكلفة)','1590':'مجمع الإهلاك','2000':'الذمم الدائنة (الموردون)','2500':'القروض','3000':'رأس المال','3100':'مسحوبات الشركاء','4900':'أرباح (خسائر) بيع أصول','5900':'مصروف الإهلاك'};
const addDays=(s,n)=>new Date(Date.parse(s)+n*864e5).toISOString().slice(0,10);
const paidOf=d=>sum(d.pays||[],p=>p.amount);
const remOf=d=>Math.max(0,d.amount-paidOf(d));
function dep(a,asOf){
  if(!(a.life>0))return 0;
  const end=a.disp&&a.disp.date<asOf?a.disp.date:asOf,days=daysBetween(a.date,end);
  if(days<=0)return 0;
  const base=Math.max(0,a.cost-(a.salvage||0));
  return Math.min(base,base/a.life*days/365.25);
}
/* دفتر اليومية يُشتق تلقائياً من كل السجلات – كل قيد متوازن */
function journal(upto){
  const names={...A_BASE},extra={},L=[];
  const ac=(kind,cat)=>{cat=cat||'أخرى';const list=kind==='r'?CI:CE,b=kind==='r'?4000:5000,i=list.indexOf(cat);let code;
    if(i>=0)code=String(b+1+i);else{const k=kind+cat;if(!extra[k])extra[k]=String(b+100+Object.keys(extra).length);code=extra[k]}
    names[code]=cat;return code};
  const add=(d,a,dr,cr,txt,src)=>{if(d&&d<=upto&&(dr||cr))L.push({d,a,dr:dr||0,cr:cr||0,txt:txt||'',src})};
  S.tx.forEach(t=>{
    if(t.type==='income'){const c=ac('r',t.cat);add(t.date,'1000',t.amount,0,t.desc,'tx');add(t.date,c,0,t.amount,t.desc,'tx')}
    else{const c=ac('e',t.cat);add(t.date,c,t.amount,0,t.desc,'tx');add(t.date,'1000',0,t.amount,t.desc,'tx')}});
  S.cap.forEach(c=>{
    if(c.type==='in'){const t='رأس مال – '+(c.partner||'');add(c.date,'1000',c.amount,0,t,'cap');add(c.date,'3000',0,c.amount,t,'cap')}
    else{const t='مسحوبات – '+(c.partner||'');add(c.date,'3100',c.amount,0,t,'cap');add(c.date,'1000',0,c.amount,t,'cap')}});
  S.assets.forEach(a=>{
    const t='شراء أصل: '+a.name;
    add(a.date,'1500',a.cost,0,t,'asset');
    add(a.date,a.fund==='kind'?'3000':a.fund==='credit'?'2000':'1000',0,a.cost,a.fund==='kind'?'مساهمة عينية: '+a.name+(a.partner?' – '+a.partner:''):t,'asset');
    if(a.disp){const acc=dep(a,a.disp.date),g=a.disp.price-(a.cost-acc),t2='استبعاد أصل: '+a.name,dd=a.disp.date;
      add(dd,'1000',a.disp.price,0,t2,'asset');add(dd,'1590',acc,0,t2,'asset');add(dd,'1500',0,a.cost,t2,'asset');
      if(g>0)add(dd,'4900',0,g,t2,'asset');else if(g<0)add(dd,'4900',-g,0,t2,'asset')}
    const dv=dep(a,upto);
    if(dv>0.004){L.push({d:upto,a:'5900',dr:dv,cr:0,txt:'إهلاك تراكمي: '+a.name,src:'dep'});L.push({d:upto,a:'1590',dr:0,cr:dv,txt:'إهلاك تراكمي: '+a.name,src:'dep'})}
  });
  S.debts.forEach(d=>{
    const t=(d.kind==='loan'?'قرض: ':d.kind==='payable'?'ذمة دائنة: ':'ذمة مدينة: ')+d.party;
    if(d.kind==='receivable'){
      if(d.jsrc!=='asset'){add(d.date,'1100',d.amount,0,t,'debt');add(d.date,ac('r',d.cat),0,d.amount,t,'debt')}
      (d.pays||[]).forEach(p=>{add(p.date,'1000',p.amount,0,'تحصيل: '+d.party,'debt');add(p.date,'1100',0,p.amount,'تحصيل: '+d.party,'debt')});
    }else if(d.kind==='payable'){
      if(d.jsrc!=='asset'){add(d.date,ac('e',d.cat),d.amount,0,t,'debt');add(d.date,'2000',0,d.amount,t,'debt')}
      (d.pays||[]).forEach(p=>{add(p.date,'2000',p.amount,0,'سداد: '+d.party,'debt');add(p.date,'1000',0,p.amount,'سداد: '+d.party,'debt')});
    }else{
      add(d.date,'1000',d.amount,0,t,'debt');add(d.date,'2500',0,d.amount,t,'debt');
      (d.pays||[]).forEach(p=>{add(p.date,'2500',p.amount,0,'سداد قرض: '+d.party,'debt');add(p.date,'1000',0,p.amount,'سداد قرض: '+d.party,'debt')});
    }
  });
  L.sort((x,y)=>x.d.localeCompare(y.d));
  return{L,names};
}
const balances=L=>{const b={};L.forEach(l=>{b[l.a]=(b[l.a]||0)+l.dr-l.cr});return b};
const cashBal=()=>balances(journal(today()).L)['1000']||0;
const nbvNow=()=>sum(S.assets.filter(a=>!a.disp),a=>a.cost-dep(a,today()));
function plData(from,to){
  const {L,names}=journal(to),rev={},exp={};
  L.forEach(l=>{if(l.src==='dep'||(from&&l.d<from))return;const f=l.a[0];
    if(f==='4')rev[l.a]=(rev[l.a]||0)+l.cr-l.dr;else if(f==='5')exp[l.a]=(exp[l.a]||0)+l.dr-l.cr});
  const dx=sum(S.assets,a=>dep(a,to)-(from?dep(a,addDays(from,-1)):0));
  if(dx>0.004)exp['5900']=dx;
  const arr=o=>Object.keys(o).sort().map(k=>[names[k]||k,o[k]]);
  const tr=sum(Object.values(rev),x=>x),te=sum(Object.values(exp),x=>x);
  return{rev:arr(rev),exp:arr(exp),tr,te,net:tr-te};
}
function bsData(asof){
  const {L}=journal(asof),b=balances(L),g=k=>b[k]||0;let ret=0;
  Object.keys(b).forEach(k=>{if(k[0]==='4'||k[0]==='5')ret-=b[k]});
  const o={cash:g('1000'),ar:g('1100'),fa:g('1500'),accd:-g('1590'),ap:-g('2000'),loans:-g('2500'),cap:-g('3000'),draw:g('3100'),ret};
  o.nfa=o.fa-o.accd;o.ta=o.cash+o.ar+o.nfa;o.tl=o.ap+o.loans;o.te=o.cap-o.draw+o.ret;
  o.ok=Math.abs(o.ta-(o.tl+o.te))<0.01;return o;
}

function accCap(){
  const inC=sum(S.cap.filter(c=>c.type==='in'),c=>c.amount),out=sum(S.cap.filter(c=>c.type==='out'),c=>c.amount),
    kinds=S.assets.filter(a=>a.fund==='kind'),inK=sum(kinds,a=>a.cost),paid=inC+inK,net=paid-out,b=bsData(today());

const b64u={
  enc(b){let s='';new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},
  dec(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s),u=new Uint8Array(r.length);for(let i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u}
};
const nowT=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const hoursBetween=(a,b)=>{const m=t=>{const [h,x]=t.split(':').map(Number);return h*60+x};let d=m(b)-m(a);if(d<0)d+=1440;return d/60};
function deviceInfo(){
  const u=navigator.userAgent||'';
  if(/iPhone|iPad/.test(u))return{n:'آيفون',m:'Face ID / Touch ID'};
  if(/SAMSUNG|SM-[A-Z]\d/i.test(u))return{n:'سامسونغ',m:'بصمة الإصبع'};
  if(/Android/.test(u))return{n:'أندرويد',m:'بصمة الإصبع / الوجه'};
  return{n:'هذا الجهاز',m:'بصمة / رمز الجهاز'};
}
function bioSupport(){
  if(location.protocol==='file:')return{ok:false,why:'افتح التطبيق عبر رابط https (لا يعمل كملف مفتوح مباشرة)'};
  if(!window.PublicKeyCredential||!navigator.credentials)return{ok:false,why:'المتصفح لا يدعم البصمة (WebAuthn)'};
  if(!window.isSecureContext)return{ok:false,why:'يتطلب اتصالاً آمناً https'};

}
function bioErr(e){
  const n=e&&e.name;
  if(n==='NotAllowedError')return'أُلغيت العملية أو لم تُقبل البصمة أو انتهت المهلة';
  if(n==='InvalidStateError')return'هذه البصمة مسجّلة مسبقاً لهذا العامل على هذا الجهاز';
  if(n==='SecurityError')return'العنوان الحالي لا يسمح بالبصمة. استخدم رابط https';
  if(n==='NotSupportedError')return'هذا الجهاز/المتصفح لا يدعم نوع البصمة المطلوب';
  return'تعذّر تنفيذ البصمة'+(e&&e.message?': '+e.message:'');
}

/* ---- التشفير والتحقق ---- */
function derToRaw(sig){
  let o=2;if(sig[1]&0x80)o+=sig[1]&0x7f;
  o++;const rl=sig[o++],r=sig.slice(o,o+rl);o+=rl;o++;const sl=sig[o++],s=sig.slice(o,o+sl);
  const fix=x=>{while(x.length>32&&x[0]===0)x=x.slice(1);const out=new Uint8Array(32);out.set(x,32-x.length);return out};
  const raw=new Uint8Array(64);raw.set(fix(r),0);raw.set(fix(s),32);return raw;
}
async function challengeFor(d,t,k,n){return new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(`${d}|${t}|${k}|${n}`)))}
async function verifyProof(p,cred){
  try{
    if(!p||!cred||!cred.pub)return false;
    const cd=JSON.parse(new TextDecoder().decode(b64u.dec(p.cd)));
    const ch=await challengeFor(p.d,p.t,p.k,p.n);
    if(cd.type!=='webauthn.get'||cd.challenge!==b64u.enc(ch))return false;
    const ad=b64u.dec(p.ad);if(!(ad[32]&4))return false; /* تحقق المستخدم UV */
    const h=new Uint8Array(await crypto.subtle.digest('SHA-256',b64u.dec(p.cd)));
    const data=new Uint8Array(ad.length+32);data.set(ad);data.set(h,ad.length);
    const spki=b64u.dec(cred.pub),sig=b64u.dec(p.s);
    if(cred.alg===-7){const k=await crypto.subtle.importKey('spki',spki,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);return await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,derToRaw(sig),data)}
    if(cred.alg===-257){const k=await crypto.subtle.importKey('spki',spki,{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['verify']);return await crypto.subtle.verify('RSASSA-PKCS1-v1_5',k,sig,data)}
    return false;
  }catch(e){return false}
}

/* ---- تسجيل بصمة عامل على هذا الهاتف ---- */
async function enrollBio(wid){
  const w=dWorker(wid),sp=bioSupport();
  if(!sp.ok){toast(sp.why);return}
  try{
    const cred=await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'SME Agri'},
      user:{id:new TextEncoder().encode(w.id),name:w.name,displayName:w.name},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
      attestation:'none',timeout:60000}});
    let pub=null,alg=null;try{pub=b64u.enc(cred.response.getPublicKey());alg=cred.response.getPublicKeyAlgorithm()}catch(e){}
    w.creds=w.creds||[];w.creds.push({id:b64u.enc(cred.rawId),pub,alg,dev:deviceInfo().n,date:today()});
    save();render();toast(`✓ تم ربط بصمة ${w.name} بهذا الهاتف`);
  }catch(e){toast(bioErr(e))}
}

async function bioCapture(kind,wid){
  const sp=bioSupport();if(!sp.ok){toast(sp.why);return null}
  const d=today(),t=nowT(),n=b64u.enc(crypto.getRandomValues(new Uint8Array(8)));
  const opts={challenge:await challengeFor(d,t,kind,n),userVerification:'required',timeout:60000};
  if(wid){const w=dWorker(wid);if(!(w.creds||[]).length){toast('لا توجد بصمة مسجّلة لهذا العامل');return null}opts.allowCredentials=w.creds.map(c=>({type:'public-key',id:b64u.dec(c.id)}))}
  const a=await navigator.credentials.get({publicKey:opts});
  const cid=b64u.enc(a.rawId),w=S.daily.find(x=>(x.creds||[]).some(c=>c.id===cid));
  if(!w){toast('هذه البصمة غير مرتبطة بأي عامل في النظام');return null}
  if(wid&&w.id!==wid){toast('البصمة تخص عاملاً آخر');return null}
  const proof={c:cid,cd:b64u.enc(a.response.clientDataJSON),ad:b64u.enc(a.response.authenticatorData),s:b64u.enc(a.response.signature),n,k:kind,d,t};
  return{w,proof,ok:await verifyProof(proof,w.creds.find(c=>c.id===cid)),d,t};
}
async function dCheck(kind){
  if(!S.daily.some(w=>(w.creds||[]).length)){toast('سجّل بصمة عامل أولاً من تبويب «العمال»');return}
  const sel=$('#dsel')?$('#dsel').value:'';
  let r;try{r=await bioCapture(kind,sel)}catch(e){toast(bioErr(e));return}
  if(!r)return;
  const w=r.w,rec=dRec(w.id,r.d);
  if(kind==='in'){
    if(rec&&rec.in&&!rec.out){toast(`${w.name} مسجّل حضوره منذ ${rec.in}. سجّل الانصراف عند المغادرة`);return}
    if(rec&&rec.in&&rec.out){toast(`${w.name}: اكتمل تسجيل اليوم`);return}
    if(rec){rec.in=r.t;rec.method='bio';rec.ver=r.ok;rec.pin=r.proof;if(!rec.day)rec.day=1}
    else S.dlog.push({id:uid(),wid:w.id,date:r.d,in:r.t,out:'',day:1,method:'bio',ver:r.ok,pin:r.proof,paid:''});
    toast(`✓ ${w.name} – سُجّل الحضور ${r.t}${r.ok?'':' (غير موثّق)'}`);
  }else{
    if(!rec||!rec.in){toast(`${w.name}: لا يوجد حضور مسجّل اليوم`);return}
    if(rec.out){toast(`${w.name}: الانصراف مسجّل مسبقاً`);return}
    rec.out=r.t;rec.pout=r.proof;rec.ver=!!(rec.ver&&r.ok);
    if(!rec.edited)rec.day=hoursBetween(rec.in,r.t)>=(S.dayHours||6)?1:0.5;
    toast(`✓ ${w.name} – سُجّل الانصراف ${r.t} (${num(hoursBetween(rec.in,r.t))} ساعة)`);
  }
  save();render();
}
function dSet(wid,d,v){
  const r=dRec(wid,d);

  save();render();
}

function payDaily(wid){

function undoPay(pid,keepTx){
  const p=S.dpays.find(x=>x.id===pid);if(!p)return;

}

function dExport(){return JSON.stringify({app:'sme-agri-daily',v:1,at:new Date().toISOString(),workers:S.daily,log:S.dlog.map(r=>({...r,paid:''}))})}
async function dImport(text){
  let d;try{d=JSON.parse(text)}catch(e){toast('الملف غير صالح');return}
  if(!d||d.app!=='sme-agri-daily'||!Array.isArray(d.workers)||!Array.isArray(d.log)){toast('هذا ليس ملف حضور من التطبيق');return}
  let nw=0,nl=0,up=0,bad=0;
  d.workers.forEach(iw=>{
    if(!iw||!iw.id||!iw.name)return;
    const w=dWorker(iw.id);
    if(!w){S.daily.push({id:iw.id,name:String(iw.name),job:String(iw.job||''),rate:+iw.rate||0,phone:iw.phone||'',idno:iw.idno||'',creds:Array.isArray(iw.creds)?iw.creds:[]});nw++}
    else(iw.creds||[]).forEach(c=>{if(!(w.creds=w.creds||[]).some(x=>x.id===c.id))w.creds.push(c)});
  });
  for(const ir of d.log){
    if(!ir||!ir.id||!dWorker(ir.wid)||!/^\d{4}-\d\d-\d\d$/.test(ir.date))continue;
    const w=dWorker(ir.wid),cr=id=>(w.creds||[]).find(c=>c.id===id);
    let rec=S.dlog.find(r=>r.id===ir.id);
    const isNew=!rec;
    if(isNew){rec={id:ir.id,wid:ir.wid,date:ir.date,in:ir.in||'',out:ir.out||'',day:+ir.day||0,method:ir.method==='bio'?'bio':'manual',ver:false,paid:'',edited:!!ir.edited,pin:ir.pin,pout:ir.pout};S.dlog.push(rec);nl++}
    else if(!rec.out&&ir.out&&!rec.paid){rec.out=ir.out;rec.pout=ir.pout;if(!rec.edited)rec.day=+ir.day||rec.day;up++}
    else continue;
    if(rec.method==='bio'){
      const a=rec.pin?await verifyProof(rec.pin,cr(rec.pin.c)):false,b=rec.out?(rec.pout?await verifyProof(rec.pout,cr(rec.pout.c)):false):true;
      rec.ver=a&&b;if(!rec.ver)bad++;
    }
  }
  save();render();toast(`تم الدمج: ${nw} عامل، ${nl} سجل جديد، ${up} تحديث${bad?`، ${bad} غير موثّق`:''}`);
}

/* ---- كتابة ملف PDF (بدون مكتبات) ---- */
function buildPDF(pages,meta){
  const enc=new TextEncoder(),chunks=[],offs=[];let pos=0;
  const push=x=>{const u=typeof x==='string'?enc.encode(x):x;chunks.push(u);pos+=u.length};
  const obj=(id,b)=>{offs[id]=pos;push(`${id} 0 obj\n${b}\nendobj\n`)};
  const n=pages.length,W=595.28,H=841.89;
  const u16=s=>'<FEFF'+[...String(s)].filter(ch=>ch.codePointAt(0)<0xFFFF).map(ch=>ch.codePointAt(0).toString(16).padStart(4,'0')).join('')+'>';
  push('%PDF-1.4\n%âãÏÓ\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R /PageLayout /SinglePage >>');
  obj(2,`<< /Type /Pages /Kids [${pages.map((_,i)=>`${3+3*i} 0 R`).join(' ')}] /Count ${n} >>`);
  pages.forEach((cv,i)=>{
    const pid=3+3*i,cid=pid+1,iid=pid+2,b64=cv.toDataURL('image/jpeg',.92).split(',')[1],bin=atob(b64),jpg=new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++)jpg[k]=bin.charCodeAt(k);
    obj(pid,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${iid} 0 R >> /ProcSet [/PDF /ImageC] >> /Contents ${cid} 0 R >>`);
    const cs=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;obj(cid,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offs[iid]=pos;push(`${iid} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);push(jpg);push('\nendstream\nendobj\n');
  });
  const info=3+3*n,d=new Date(),p2=x=>String(x).padStart(2,'0');
  obj(info,`<< /Title ${u16(meta.title)} /Author ${u16(meta.author)} /Creator (SME Agri) /Producer (SME Agri) /CreationDate (D:${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}) >>`);
  const xr=pos;let x=`xref\n0 ${info+1}\n0000000000 65535 f \n`;
  for(let i=1;i<=info;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x+`trailer\n<< /Size ${info+1} /Root 1 0 R /Info ${info} 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(chunks,{type:'application/pdf'});
}

const toDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
function anchorGo(href,name,blank){const a=document.createElement('a');a.href=href;a.download=name;a.rel='noopener';if(blank)a.target='_blank';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),4000)}
const SAVE_METHODS={
  blob:async(n,b)=>{const u=URL.createObjectURL(b);anchorGo(u,n);setTimeout(()=>URL.revokeObjectURL(u),90000)},
  data:async(n,b)=>{anchorGo(await toDataURL(b),n,true)}
};
async function saveFile(name,data,type,alt,onOk){
  const blob=data instanceof Blob?data:new Blob([data],{type});
  try{
    const file=new File([blob],name,{type});
    if(/Android|iPhone|iPad|Mobi/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name});toast('تمت المشاركة / الحفظ ✓');if(onOk)onOk();return;
    }
  }catch(e){if(e&&e.name==='AbortError')return}
  if(!isWV()){await SAVE_METHODS.blob(name,blob);toast('تم تنزيل الملف: '+name);if(onOk)onOk();return}
  /* داخل تطبيق أندرويد (WebView): نجرّب أكثر من طريقة ونسأل المستخدم */
  const known=S.saveOK&&SAVE_METHODS[S.saveOK]?S.saveOK:'';
  if(known){await SAVE_METHODS[known](name,blob);toast('أُرسل «'+name+'» للتنزيل. إن لم يظهر فاضغط «❓ لا يُحفظ الملف؟»');if(onOk)onOk();return}
  const order=Object.keys(SAVE_METHODS);let i=0;
  const attempt=async()=>{
    const m=order[i];try{await SAVE_METHODS[m](name,blob)}catch(e){}
    const o=modal('💾 هل تم حفظ الملف؟',`<p style="line-height:1.9">جرّبنا الطريقة ${i+1} من ${order.length}. افتح لوحة الإشعارات أو «ملفاتي ← التنزيلات» وتحقق من وجود:<br><b dir="ltr">${esc(name)}</b></p><div class="acts"><button class="btn" id="yy">✅ نعم، ظهر</button><button class="btn ghost" id="nn">❌ لا</button></div>`);
    o.querySelector('#yy').onclick=()=>{S.saveOK=m;save();o.remove();toast('تم ✓ سنعتمد هذه الطريقة تلقائياً');if(onOk)onOk()};
    o.querySelector('#nn').onclick=()=>{o.remove();i++;if(i<order.length)attempt();else altSaveHelp(alt,onOk)};
  };
  attempt();
}

  const days=S.lastBackup?daysBetween(S.lastBackup,today()):999;
  if(days<7)return'';
  return`<div class="alert a-info" style="align-items:center"><span>💾</span><span class="sp">${S.lastBackup?`آخر نسخة احتياطية قبل ${days} يوماً.`:'لم تأخذ نسخة احتياطية بعد.'} احفظ نسخة لحماية بياناتك.</span><button class="btn gold sm" onclick="backup()">نسخ الآن</button><button class="btn ghost sm" onclick="S.hideBk=today();save();render()">لاحقاً</button></div>`;
}

/* ---------- الهوية والترحيب ---------- */
function greeting(){const h=new Date().getHours();return h>=5&&h<12?['صباح الخير','☀️']:h>=12&&h<17?['طاب يومك','🌤️']:['مساء الخير','🌙']}
function longDate(){return new Date().toLocaleDateString(LOC(),{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function alertCount(){return lowStock().length+debtAlerts().length+S.fields.filter(f=>f.harvest&&f.status!=='مكتمل'&&daysBetween(today(),f.harvest)<=14).length}
function greetBanner(){
  const [g,e]=greeting(),n=S.user?'، '+esc(S.user):'',al=alertCount();
  return secureWarn()+backupWarn()+`<div class="greet"><img src="${LOGO}" alt=""><div class="sp"><h2>${g}${n} ${e}</h2><p>${S.user?esc(S.role)+' • ':''}${longDate()} • ${esc(S.co.short||S.farm)}</p></div>${al?`<span class="tag t-y">🔔 ${al} تنبيه</span>`:''}</div>`;
}
function showSplash(force){
  if(S.welcomed&&!S.welcome&&!force)return;
  const sp=$('#splash'),[g,e]=greeting(),first=!S.welcomed,al=alertCount();
  const active=S.fields.filter(f=>f.status!=='مكتمل').length;
  sp.className='';
  sp.innerHTML=`<div class="sp-fl"><span>🍈</span><span>🍉</span><span>🌿</span><span>🌱</span><span>🍃</span><span>🍈</span></div>
  <div class="sp-logo"><img src="${LOGO}" alt="SME Agri"></div>
  <div class="sp-hi">${g} ${e}</div>
  <h1>${first?'أهلاً بك في '+esc(S.co.short||'SME Agri'):'مرحباً بك'+(S.user?'، '+esc(S.user):'')}</h1>
  <p class="sp-co">${esc(S.co.fr||'')}</p>
  <p class="sp-tag">نظام إدارة المزارع المتكامل</p>
  ${first?`<div class="sp-in"><input id="spn" placeholder="ما اسمك؟ (اختياري)" maxlength="40" autocomplete="name" value="${esc(S.user)}"></div>`:`<div class="sp-chips"><span>🌱 ${active} حقول نشطة</span><span>👷 ${S.workers.length} عاملين</span>${al?`<span>🔔 ${al} تنبيه</span>`:''}</div>`}
  <button class="sp-btn" id="spb">ابدأ العمل ←</button>
  ${first?'':'<div class="sp-bar"><span></span></div>'}`;
  document.body.style.overflow='hidden';
  let closed=false;
  const close=()=>{
    if(closed)return;closed=true;
    if(first){const v=($('#spn')||{}).value;if(v&&v.trim())S.user=v.trim();S.welcomed=true;save();render()}
    sp.classList.add('out');document.body.style.overflow='';setTimeout(()=>{sp.innerHTML=''},900);
  };
  $('#spb').onclick=e=>{e.stopPropagation();close()};
  if(first)$('#spn').addEventListener('keydown',e=>{if(e.key==='Enter')close()});
  else{sp.onclick=close;setTimeout(close,3800)}
}
function setupBranding(){
  $('#tlogo').src=LOGO;document.title='SME Agri – نظام إدارة المزارع';
  const add=(rel,href,at)=>{const l=document.createElement('link');l.rel=rel;l.href=href;for(const k in (at||{}))l.setAttribute(k,at[k]);document.head.appendChild(l)};
  add('icon',ICON192,{type:'image/png',sizes:'192x192'});
  add('apple-touch-icon',ICON180,{sizes:'180x180'});
  const hosted=!!document.querySelector('link[rel=manifest]');
  if(hosted){if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}
  else try{
    const m={name:'SME Agri – إدارة المزرعة',short_name:'SME Agri',lang:'ar',dir:'rtl',display:'standalone',background_color:'#ffffff',theme_color:'#1a4d24',start_url:location.href.split('#')[0],icons:[{src:ICON192,sizes:'192x192',type:'image/png'},{src:ICON512,sizes:'512x512',type:'image/png',purpose:'any'}]};
    add('manifest',URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'})));
  }catch(e){}
}

/* ---------- معلومات الشركة ---------- */
function rCompany(){
  const c=S.co,row=(i,l,v,ltr)=>`<div class="irow"><span class="ii">${i}</span><div><small>${l}</small><b ${ltr?'dir="ltr" style="text-align:right"':''}>${v?esc(v):'<span class="muted">غير محدد</span>'}</b></div></div>`;
  $('#view').innerHTML=`
  <div class="card chero"><img src="${LOGO}" alt="SME Agri"><div><h2>${esc(c.short||'SME Agri')}</h2><p class="fr">${esc(c.fr)}</p>${c.ar?`<p class="ar">${esc(c.ar)}</p>`:''}<p class="muted">${esc(c.activity)}</p>
  <div class="row" style="margin-top:14px"><button class="btn gold" onclick="editCompany()">✎ تعديل المعلومات</button><button class="btn ghost" onclick="window.print()">🖨 طباعة</button></div></div></div>
  <div class="grid g4" style="margin-top:16px">
    <div class="card kpi"><span class="ic">🌱</span><small>الحقول</small><b>${S.fields.length}</b></div>
    <div class="card kpi"><span class="ic">📐</span><small>المساحة</small><b>${num(sum(S.fields,f=>f.area))} <small>${esc(S.areaUnit)}</small></b></div>
    <div class="card kpi"><span class="ic">👷</span><small>العاملون</small><b>${S.workers.length}</b></div>
    <div class="card kpi"><span class="ic">📦</span><small>أصناف المخزون</small><b>${S.items.length}</b></div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h3>📇 بيانات الاتصال</h3>${row('📞','الهاتف',c.phone,1)}${row('✉️','البريد الإلكتروني',c.email,1)}${row('🌐','الموقع الإلكتروني',c.web,1)}${row('📍','العنوان',[c.addr,c.city,c.country].filter(Boolean).join('، '))}</div>
    <div class="card"><h3>🏛️ البيانات الرسمية</h3>${row('👤','المدير / المسؤول',c.manager)}${row('📅','سنة التأسيس',c.founded)}${row('🧾','السجل التجاري',c.reg,1)}${row('🔖','الرقم الضريبي (NIF)',c.nif,1)}</div>
  </div>
  ${c.about?`<div class="card" style="margin-top:16px"><h3>📖 نبذة عن الشركة</h3><p style="line-height:2">${esc(c.about)}</p></div>`:''}`;
}
function editCompany(){
  form('تعديل معلومات الشركة',[
    {k:'short',l:'الاسم المختصر',req:1,half:1},{k:'founded',l:'سنة التأسيس',half:1},
    {k:'fr',l:'الاسم الرسمي (فرنسي)'},{k:'ar',l:'الاسم بالعربية'},{k:'activity',l:'النشاط'},
    {k:'manager',l:'المدير / المسؤول'},
    {k:'phone',l:'الهاتف',t:'tel',half:1},{k:'email',l:'البريد الإلكتروني',t:'email',half:1},
    {k:'web',l:'الموقع الإلكتروني'},
    {k:'city',l:'المدينة',half:1},{k:'country',l:'الدولة',half:1},{k:'addr',l:'العنوان'},
    {k:'reg',l:'السجل التجاري',half:1},{k:'nif',l:'الرقم الضريبي',half:1},
    {k:'about',l:'نبذة عن الشركة',t:'textarea'}],S.co,r=>{
    Object.assign(S.co,r);S.farm=r.short;save();render();toast('تم حفظ معلومات الشركة ✓');
  });
}

/* ---------- الإعدادات ---------- */
const CURS=[['MRU','أوقية موريتانية (MRU)'],['SAR','ريال سعودي (SAR)'],['AED','درهم إماراتي (AED)'],['MAD','درهم مغربي (MAD)'],['DZD','دينار جزائري (DZD)'],['TND','دينار تونسي (TND)'],['EGP','جنيه مصري (EGP)'],['USD','دولار أمريكي ($)'],['EUR','يورو (€)'],['XOF','فرنك غرب أفريقي (CFA)'],['__c','أخرى (إدخال يدوي)']];
function rSet(){
  const known=CURS.some(c=>c[0]===S.cur&&c[0]!=='__c');
  const sel=(id,opts,val,at='')=>`<select id="${id}" ${at}>${opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===val?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
  const kb=Math.max(1,Math.round(JSON.stringify(S).length/1024));
  $('#view').innerHTML=`<div class="grid g2">
  <div class="card"><h3>👤 الملف الشخصي</h3>
    <div class="fg"><label>اسم المستخدم (يظهر في الترحيب)</label><input id="su" value="${esc(S.user)}" maxlength="40" placeholder="مثال: مولاي"></div>
    <div class="fg"><label>الصفة</label><input id="sr" value="${esc(S.role)}" maxlength="40"></div></div>
  <div class="card"><h3>🎨 المظهر والترحيب</h3>
    <div class="fg"><label>نمط العرض</label>${sel('st',[['auto','تلقائي (حسب الجهاز)'],['light','فاتح'],['dark','ليلي']],S.theme)}</div>
    <div class="fg"><label>شاشة الترحيب عند التشغيل</label>${sel('sw',[['1','تظهر في كل مرة'],['0','لا تظهر']],S.welcome?'1':'0')}</div>
    <button class="btn ghost sm" onclick="showSplash(true)">👁 معاينة شاشة الترحيب</button></div>
  <div class="card"><h3>🔢 العملة والوحدات</h3>
    <div class="fg"><label>العملة</label>${sel('sc',CURS,known?S.cur:'__c','onchange="$(\'#sc2\').style.display=this.value===\'__c\'?\'block\':\'none\'"')}
      <input id="sc2" style="margin-top:8px;display:${known?'none':'block'}" value="${known?'':esc(S.cur)}" placeholder="رمز العملة" maxlength="12"></div>
    <div class="fr"><div class="fg"><label>وحدة المساحة</label>${sel('sa',[['هكتار','هكتار'],['فدان','فدان'],['دونم','دونم'],['م²','متر مربع']],S.areaUnit)}</div>
    <div class="fg"><label>الأرقام</label>${sel('sd',[['latn','لاتينية (123)'],['arab','هندية (١٢٣)']],S.digits)}</div></div></div>
  <div class="card"><h3>📍 الموقع والطقس</h3>
    <p style="margin-bottom:12px">${S.loc?`<b>${esc(S.loc.name)}</b><br><span class="muted">${S.loc.lat}, ${S.loc.lon}</span>`:'<span class="muted">لم يُحدَّد موقع بعد</span>'}</p>
    <div class="row"><button class="btn gold sm" onclick="pickLocation()">📍 ${S.loc?'تغيير الموقع':'تحديد الموقع'}</button>${S.loc?`<button class="btn ghost sm" onclick="S.loc=null;W=null;save();updLoc();render()">إزالة</button>`:''}</div></div>
  <div class="card" style="grid-column:1/-1"><h3>🔐 الأذونات والاتصال</h3><div id="permBox"><p class="muted"><span class="spin">⏳</span> جارٍ الفحص…</p></div></div>
  ${snapCard()}
  <div class="card"><h3>💾 البيانات</h3>
    <p class="muted" style="margin-bottom:12px">كل بياناتك مخزّنة داخل متصفحك فقط (${kb} ك.ب). خذ نسخة احتياطية بانتظام.</p>
    <div class="row"><button class="btn" onclick="backup()">💾 حفظ / مشاركة نسخة</button><button class="btn ghost" onclick="chooseFile(restore)">⬆ استرجاع من ملف</button><button class="btn ghost" onclick="textBackup()">📋 كنص</button></div>
    <div class="row" style="margin-top:12px"><button class="btn gold" onclick="demo()">بيانات تجريبية</button><button class="btn red" onclick="resetAll()">مسح كل البيانات</button></div></div>
  <div class="card"><h3>ℹ️ حول التطبيق</h3>
    <div class="ver"><img src="${LOGO}" alt=""><div><b>SME Agri – إدارة المزارع</b><br><span class="muted">الإصدار 2.4</span></div></div>
    <p class="muted" style="margin-top:12px;line-height:1.9">لإضافته إلى شاشة هاتفك: من قائمة المتصفح اختر «إضافة إلى الشاشة الرئيسية» وسيظهر بشعار الشركة.</p></div>
  </div>
  <button class="btn" style="width:100%;margin-top:16px;padding:14px" onclick="saveSet()">حفظ الإعدادات</button>`;
  permCheck();
}
function saveSet(){
  S.user=$('#su').value.trim();S.role=$('#sr').value.trim()||'المدير';
  S.theme=$('#st').value;S.welcome=$('#sw').value==='1';
  const c=$('#sc').value;S.cur=c==='__c'?($('#sc2').value.trim()||'MRU'):c;
  S.areaUnit=$('#sa').value;S.digits=$('#sd').value;
  save();applyTheme();render();toast('تم حفظ الإعدادات ✓');
}
function backup(){dl('farm-backup-'+today()+'.json',JSON.stringify(S,null,1),'application/json',()=>{S.lastBackup=today();save();if(cur==='dashboard')render()})}
function restoreText(txt){try{const d=JSON.parse(txt);if(typeof d!=='object'||!Array.isArray(d.fields))throw 0;S=norm(Object.assign(fresh(),d));save();applyTheme();updLoc();W=null;loadWeather();render();toast('تم الاسترجاع ✓');return true}catch(e){toast('الملف أو النص غير صالح');return false}}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>restoreText(r.result);r.onerror=()=>toast('تعذّرت قراءة الملف');r.readAsText(f)}
function resetAll(){confirmBox('سيتم حذف جميع البيانات نهائياً. هل أنت متأكد؟',()=>{const t=S.theme;S=fresh();S.theme=t;S.welcomed=true;save();W=null;updLoc();render();toast('تم مسح البيانات')})}
function demo(){
  const d=n=>{const x=new Date();x.setDate(x.getDate()+n);return new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
  S.fields=[{id:uid(),name:'الحقل الشمالي',crop:'قمح',variety:'محلي',area:12,yield:36,plant:d(-70),harvest:d(40),status:'نمو',irr:'رش',notes:'تربة طينية خصبة',acts:[{type:'ري',date:d(-3),cost:0},{type:'تسميد',date:d(-12),cost:850}]},
    {id:uid(),name:'بيت الطماطم 1',crop:'طماطم',variety:'هجين',area:2.5,yield:60,plant:d(-45),harvest:d(10),status:'نضج',irr:'تنقيط',acts:[{type:'رش مبيدات',date:d(-5),cost:300}]},
    {id:uid(),name:'بستان النخيل',crop:'تمور',variety:'مجهول',area:8,yield:20,plant:d(-2000),harvest:d(90),status:'نمو',irr:'غمر'}];
  S.workers=[{id:uid(),name:'أحمد سالم',role:'مشرف',salary:3500,phone:'+222 22 00 00 01',start:d(-400),pay:[]},{id:uid(),name:'محمد الأمين',role:'عامل زراعي',salary:2200,phone:'',start:d(-120),pay:[]},{id:uid(),name:'فاطمة بنت علي',role:'فرز وتعبئة',salary:2000,phone:'',start:d(-60),pay:[]}];
  S.items=[{id:uid(),name:'قمح',cat:'محاصيل',unit:'كجم',qty:1800,min:500},{id:uid(),name:'سماد NPK',cat:'أسمدة',unit:'كيس',qty:6,min:10},{id:uid(),name:'بذور طماطم',cat:'بذور',unit:'علبة',qty:40,min:10}];
  S.tx=[];[0,1,2,3,4,5].forEach(m=>{const dt=new Date();dt.setMonth(dt.getMonth()-m,10);const s=new Date(dt-dt.getTimezoneOffset()*6e4).toISOString().slice(0,10);
    S.tx.push({id:uid(),date:s,type:'income',cat:'مبيعات محاصيل',amount:8000+Math.round(Math.random()*7000),desc:'مبيعات الشهر'},{id:uid(),date:s,type:'expense',cat:'رواتب',amount:7700,desc:'رواتب العاملين'},{id:uid(),date:s,type:'expense',cat:['أسمدة','وقود','ري ومياه','صيانة'][m%4],amount:1200+Math.round(Math.random()*1800),desc:'مصروفات تشغيلية'})});
  S.cap=[{id:uid(),type:'in',partner:'مولاي علي',amount:150000,date:d(-300),note:'رأس المال المبدئي'},{id:uid(),type:'in',partner:'الشريك الثاني',amount:50000,date:d(-280),note:''},{id:uid(),type:'out',partner:'مولاي علي',amount:5000,date:d(-20),note:'مسحوبات شخصية'}];
  S.assets=[{id:uid(),name:'جرار زراعي',cat:'آلات ومعدات',date:d(-400),cost:60000,salvage:6000,life:10,serial:'TR-2024-17',loc:'المزرعة',fund:'cash'},{id:uid(),name:'مضخة مياه وشبكة تنقيط',cat:'شبكات ري وآبار',date:d(-330),cost:25000,salvage:0,life:10,fund:'cash'},{id:uid(),name:'قطعة أرض (12 هكتار)',cat:'أراضي',date:d(-500),cost:80000,salvage:0,life:0,fund:'kind',partner:'مولاي علي'},{id:uid(),name:'سيارة نقل',cat:'مركبات',date:d(-200),cost:35000,salvage:5000,life:5,fund:'cash'}];
  S.debts=[{id:uid(),kind:'receivable',party:'سوق الجملة',amount:9000,date:d(-12),due:d(6),cat:'مبيعات محاصيل',note:'شمام',pays:[{id:uid(),date:d(-5),amount:3000}],jsrc:'manual'},{id:uid(),kind:'payable',party:'مورد الأسمدة',amount:4500,date:d(-25),due:d(-3),cat:'أسمدة',note:'',pays:[],jsrc:'manual'},{id:uid(),kind:'loan',party:'البنك',amount:20000,date:d(-150),due:d(200),cat:'',note:'قرض موسمي',pays:[{id:uid(),date:d(-60),amount:5000}],jsrc:'manual'}];
  S.daily=[{id:uid(),name:'سيدي أحمد',job:'حصاد',rate:300,phone:'',idno:'',creds:[]},{id:uid(),name:'بابه ولد محمد',job:'ري',rate:250,phone:'',idno:'',creds:[]},{id:uid(),name:'خديجة منت سالم',job:'فرز وتعبئة',rate:250,phone:'',idno:'',creds:[]}];
  S.dlog=[];S.dpays=[];S.daily.forEach((w,wi)=>{for(let i=1;i<=10;i++){const x=(i*7+wi*3)%10;if(x===0)continue;S.dlog.push({id:uid(),wid:w.id,date:d(-i),in:'',out:'',day:x===1?0.5:1,method:'manual',ver:false,paid:''})}});
  save();render();toast('تم تحميل البيانات التجريبية ✓');
}

/* ===================== الثيم والإقلاع ===================== */
function applyTheme(){const d=S.theme==='dark'||(S.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';$('#themeBtn').textContent=d?'☀️':'🌙';const m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#0f1713':'#1a4d24'}
function toggleTheme(){S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();applyTheme();if(chartJob)chartJob()}
(function init(){
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='auto'){applyTheme();if(chartJob)chartJob()}})}catch(e){}
  applyTheme();updLoc();
  const h=location.hash.slice(1);if(PAGES[h])cur=h;
  render();loadWeather();setupBranding();showSplash();
  window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(PAGES[h]&&h!==cur){cur=h;render()}});
})();
</script>
